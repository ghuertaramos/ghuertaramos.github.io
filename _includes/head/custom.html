{% include base_path %}

<!-- start custom head snippets -->

<!-- Custom favicon / tab icon -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/logo_website.png?v=20260507b">
<link rel="icon" type="image/png" sizes="96x96" href="{{ base_path }}/images/logo_website.png?v=20260507b">
<link rel="icon" type="image/png" sizes="192x192" href="{{ base_path }}/images/logo_website.png?v=20260507b">
<link rel="shortcut icon" type="image/png" href="{{ base_path }}/images/logo_website.png?v=20260507b">

<!-- Apple / mobile icon -->
<link rel="apple-touch-icon" href="{{ base_path }}/images/logo_website.png?v=20260507b">

<!-- Browser / mobile theme colors -->
<meta name="msapplication-TileColor" content="#000000">
<meta name="msapplication-TileImage" content="{{ base_path }}/images/logo_website.png?v=20260507b">
<meta name="theme-color" content="#ffffff">

<!-- Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- MathJax -->
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    TeX: {
      equationNumbers: {
        autoNumber: "all"
      }
    }
  });
</script>

<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML" async></script>

<!-- end custom head snippets -->
